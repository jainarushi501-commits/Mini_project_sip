<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fake Image Detector{% endblock %} | Digital Image Forensics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand brand text-white" href="{{ url_for('index') }}"><i class="bi bi-search-heart"></i> FakeImage<span style="color:var(--cyan)">Detector</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><i class="bi bi-list text-white fs-2"></i></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='home' }}" href="{{ url_for('index') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='detect' }}" href="{{ url_for('detect') }}">Detector</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='history' }}" href="{{ url_for('history') }}">History</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='about' }}" href="{{ url_for('about') }}">About</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='contact' }}" href="{{ url_for('contact') }}">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer><div class="container d-flex flex-wrap justify-content-between gap-2">
  <span>Fake Image Detector &middot; rule-based digital image forensics &middot; no machine learning</span>
  <span>Results are forensic indicators, not proof.</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
